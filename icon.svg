<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF7FC"/>
      <stop offset="100%" stop-color="#C9ECF6"/>
    </linearGradient>
    <clipPath id="bgClip">
      <rect x="16" y="16" width="480" height="480" rx="104"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)"/>

  <g clip-path="url(#bgClip)">
    <!-- steam wisps -->
    <g fill="none" stroke="#BFE7F2" stroke-width="10" stroke-linecap="round" opacity="0.75">
      <path d="M190 90 C 178 72, 202 62, 190 44"/>
      <path d="M256 78 C 244 60, 268 50, 256 32"/>
      <path d="M322 90 C 310 72, 334 62, 322 44"/>
    </g>

    <!-- tail -->
    <path d="M118 232 C 96 224, 96 200, 118 196 C 132 193, 138 206, 126 214"
          fill="none" stroke="#E8688F" stroke-width="10" stroke-linecap="round"/>

    <!-- ear -->
    <path d="M158 156 L 140 104 L 196 140 Z" fill="#F48FB1" stroke="#E8688F" stroke-width="6" stroke-linejoin="round"/>

    <!-- body -->
    <ellipse cx="248" cy="246" rx="136" ry="98" fill="#FBA8C0" stroke="#E8688F" stroke-width="7"/>

    <!-- snout -->
    <ellipse cx="368" cy="256" rx="40" ry="29" fill="#F48FB1" stroke="#E8688F" stroke-width="6"/>
    <ellipse cx="380" cy="250" rx="5.5" ry="7.5" fill="#B24F6C"/>
    <ellipse cx="380" cy="264" rx="5.5" ry="7.5" fill="#B24F6C"/>

    <!-- eye -->
    <circle cx="306" cy="208" r="11" fill="#3A2E35"/>
    <circle cx="309" cy="204" r="3.4" fill="#FFFFFF"/>

    <!-- coin slot -->
    <rect x="222" y="142" width="76" height="15" rx="7.5" fill="#3A2E35" transform="rotate(-9 260 149)"/>

    <!-- coin dropping in -->
    <g transform="rotate(-18 262 104)">
      <ellipse cx="262" cy="104" rx="23" ry="27" fill="#F5C542" stroke="#C89A2E" stroke-width="5"/>
      <ellipse cx="262" cy="104" rx="12" ry="16" fill="none" stroke="#C89A2E" stroke-width="3"/>
    </g>

    <!-- legs -->
    <g fill="#F48FB1" stroke="#E8688F" stroke-width="5">
      <rect x="156" y="304" width="28" height="72" rx="12"/>
      <rect x="212" y="316" width="28" height="72" rx="12"/>
      <rect x="284" y="316" width="28" height="72" rx="12"/>
      <rect x="340" y="304" width="28" height="72" rx="12"/>
    </g>

    <!-- water -->
    <path d="M-10 356 C 60 330, 120 382, 190 356 C 260 330, 320 382, 390 356 C 440 336, 480 350, 522 340 L 522 522 L -10 522 Z"
          fill="#8FD9EF" opacity="0.9"/>
    <path d="M-10 388 C 70 360, 130 412, 200 388 C 270 362, 330 414, 400 388 C 450 368, 480 380, 522 372 L 522 522 L -10 522 Z"
          fill="#4FB6E0"/>

    <!-- bubbles -->
    <g fill="#EAF7FC" opacity="0.85">
      <circle cx="176" cy="410" r="7"/>
      <circle cx="204" cy="440" r="5"/>
      <circle cx="352" cy="418" r="6"/>
    </g>
  </g>
</svg>
